name: GitHub Pages (static)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch Threads data
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FETCH_INSIGHTS: "true"
        run: node scripts/fetch-posts.mjs

      - name: Assemble site
        run: |
          set -e
          SITE="_site"
          rm -rf "$SITE"
          mkdir -p "$SITE/data"
          cp -r public/* "$SITE/"
          cp data/posts.json "$SITE/data/posts.json"
          touch "$SITE/.nojekyll"
          cat > "$SITE/config.js" <<'EOF'
          window.__THREADFRAME__ = { base: "/threadframe/", static: true };
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
